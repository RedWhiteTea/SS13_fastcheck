var selectedTags = {};
var sortMode = 'relevance';
var sortAsc = true;

function getLvColor(lv) {
  var colors = ['#ffffff','#4caf50','#ffeb3b','#ff9800','#f44336','#b71c1c'];
  return colors[lv] || '#ffffff';
}

function buildTags() {
  var html = '';
  ALL_TAGS.forEach(function(t) {
    html += '<span class="contra-tag" onclick="toggleTag(\'' + t + '\', this)">' + t + '</span>';
  });
  document.getElementById('contraTagContainer').innerHTML = html;
}

function toggleTag(tag, el) {
  if (selectedTags[tag]) { delete selectedTags[tag]; el.classList.remove('active'); }
  else { selectedTags[tag] = true; el.classList.add('active'); }
  renderList();
}

function renderList() {
  var activeTagList = Object.keys(selectedTags);
  var filtered = ITEMS.filter(function(item) {
    if (activeTagList.length === 0) return true;
    return activeTagList.some(function(t) { return item.t.indexOf(t) !== -1; });
  });
  if (sortMode === 'relevance') {
    filtered.sort(function(a,b) {
      var ca = a.t.filter(function(t){return activeTagList.indexOf(t)!==-1}).length;
      var cb = b.t.filter(function(t){return activeTagList.indexOf(t)!==-1}).length;
      return cb - ca;
    });
  } else if (sortMode === 'name') {
    filtered.sort(function(a,b) { return a.n.localeCompare(b.n); });
  } else {
    filtered.sort(function(a,b) { return a.lv - b.lv; });
  }
  if (!sortAsc && sortMode !== 'relevance') filtered.reverse();

  var html = '';
  filtered.forEach(function(item) {
    var tagsHtml = item.t.map(function(t) {
      var isActive = activeTagList.indexOf(t) !== -1 ? ' active' : '';
      return '<span class="contra-item-tag' + isActive + '">' + t + '</span>';
    }).join('');
    var lvColor = getLvColor(item.lv);
    var isDark = item.lv >= 4;
    html += '<div class="contra-item' + (isDark ? ' dark' : '') + '" style="background:' + lvColor + '">';
    html += '<div class="contra-item-name">' + item.n + '</div>';
    html += '<div class="contra-item-lv" style="border-color:' + (isDark ? '#fff' : 'var(--ink)') + '">Lv.' + item.lv + '</div>';
    html += '<div class="contra-item-tags">' + tagsHtml + '</div>';
    html += '</div>';
  });
  document.getElementById('contraList').innerHTML = html;
}

function toggleSortDropdown() { document.getElementById('sortDropdown').classList.toggle('open'); }
function setSort(type, el) {
  document.querySelectorAll('.sort-option').forEach(function(o) { o.classList.remove('active'); });
  el.classList.add('active');
  sortMode = type;
  renderList();
}
function toggleSortOrder() {
  sortAsc = !sortAsc;
  document.getElementById('sortOrderBtn').innerHTML = sortAsc ? '↑ 正序' : '↓ 反序';
  renderList();
}
function toggleContraTags() {
  var c = document.getElementById('contraTagContainer');
  var b = document.getElementById('contraToggle');
  c.classList.toggle('collapsed');
  b.innerHTML = c.classList.contains('collapsed') ? '► 分类筛选' : '▼ 分类筛选';
}

buildTags();
renderList();
</script>
